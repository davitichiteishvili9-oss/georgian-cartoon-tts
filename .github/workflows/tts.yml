
name: Georgian Cartoon Voice

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode name"
        required: true
        default: "Episode 1"
      speaker1:
        description: "First character"
        required: true
        default: "Fox"
      voice1:
        description: "First character voice"
        required: true
        default: "Charon"
      speaker2:
        description: "Second character"
        required: true
        default: "Robot"
      voice2:
        description: "Second character voice"
        required: true
        default: "Puck"
      dialogue:
        description: "Georgian dialogue"
        required: true
        default: |
          Fox: რობოტო, რას აკეთებ?
          Robot: უფროსო, ყავის აპარატი ავაფეთქე!

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Gemini
        run: pip install --upgrade "google-genai>=3.0.0"

      - name: Generate Georgian dialogue
        env:
          GEMINI_API_KEY: ${{ secrets.GEO }}
          EPISODE: ${{ inputs.episode }}
          SPEAKER1: ${{ inputs.speaker1 }}
          SPEAKER2: ${{ inputs.speaker2 }}
          VOICE1: ${{ inputs.voice1 }}
          VOICE2: ${{ inputs.voice2 }}
          DIALOGUE: ${{ inputs.dialogue }}
        run: |
          python - <<'PY'
          import os
          import base64
          import wave
          from google import genai

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          prompt = (
              "Perform this cartoon conversation "
              "in natural expressive Georgian. "
              "Read only the following lines:\n\n"
              + os.environ["DIALOGUE"]
          )

          interaction = client.interactions.create(
              model="gemini-3.1-flash-tts-preview",
              input=prompt,
              response_format={"type": "audio"},
              generation_config={
                  "speech_config": [
                      {
                          "speaker": os.environ["SPEAKER1"],
                          "voice": os.environ["VOICE1"]
                      },
                      {
                          "speaker": os.environ["SPEAKER2"],
                          "voice": os.environ["VOICE2"]
                      }
                  ]
              }
          )

          audio = interaction.output_audio
          if not audio or not audio.data:
              raise RuntimeError("Gemini returned no audio")

          pcm = base64.b64decode(audio.data)

          with wave.open("dialogue.wav", "wb") as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(24000)
              f.writeframes(pcm)

          print("Created dialogue.wav")
          PY

      - name: Save audio
        uses: actions/upload-artifact@v4
        with:
          name: Georgian-Cartoon-Audio
          path: dialogue.wav
          if-no-files-found: error
